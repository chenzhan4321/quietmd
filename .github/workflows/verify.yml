name: verify

# 这个项目的卖点就是"结论可以自己复算"，所以 CI 跑的就是给用户的那个自检脚本。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run the self-check
        run: bash verify.sh

      - name: install.sh works on a clean Linux box
        run: |
          ./install.sh
          test -x "$HOME/.local/bin/quietmd"
          # 真跑一次：验证 MathJax 自动下载 + 渲染都通
          "$HOME/.local/bin/quietmd" tests/math_torture.md --no-open -o /tmp/ci.html
          test -s /tmp/ci.html
          "$HOME/.local/bin/quietmd" --version
          ./uninstall.sh
          test ! -e "$HOME/.local/bin/quietmd"

      - name: --check should flag exactly the deliberately broken formula
        run: |
          set +e
          uv run --quiet --script quietmd.py tests/math_torture.md --check
          code=$?
          set -e
          # 退出码 1 = 发现了问题公式，这正是预期：测试文档里有一条故意写坏的
          [ "$code" -eq 1 ] || { echo "expected exit 1, got $code"; exit 1; }
